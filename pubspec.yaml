name: sujian
description: 素笺 · 把数字文字写回纸上
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  gal: ^2.3.0
  share_plus: ^10.1.0
  path_provider: ^2.1.5
  pdf: ^3.11.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  fonts:
    - family: KaiXin
      fonts:
        - asset: assets/fonts/KaiXin.ttf
    - family: MaShanZheng
      fonts:
        - asset: assets/fonts/MaShanZheng.ttf
    - family: ZhiMangXing
      fonts:
        - asset: assets/fonts/ZhiMangXing.ttf
    - family: LongCang
      fonts:
        - asset: assets/fonts/LongCang.ttf
    - family: ZCOOLKuaiLe
      fonts:
        - asset: assets/fonts/ZCOOLKuaiLe.ttf
