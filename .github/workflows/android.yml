name: build-apk

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    name: Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # ── 自动识别工程在仓库根目录还是 app/ 子目录 ──
      - name: 定位工程目录
        run: |
          set -e
          if [ -f pubspec.yaml ]; then
            dir="."
          elif [ -f app/pubspec.yaml ]; then
            dir="app"
          else
            echo "::error::仓库里找不到 pubspec.yaml，请确认推送的是 Flutter 工程（含 pubspec.yaml 的那一层）"
            echo "当前根目录内容："
            ls -la
            exit 1
          fi
          echo "APP_DIR=$dir" >> "$GITHUB_ENV"
          echo "工程目录 = $dir"
          ls -la "$dir"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: 环境自检
        run: |
          flutter --version
          dart --version
          java -version

      # ── 生成 Android 平台脚手架（仓库里不提交 android/） ──
      - name: 生成 Android 脚手架
        working-directory: ${{ env.APP_DIR }}
        run: flutter create --org com.sujian --project-name sujian --platforms=android .

      # ── flutter create 会覆盖源码，这里还原成仓库里的版本 ──
      - name: 还原源码
        working-directory: ${{ env.APP_DIR }}
        run: |
          git checkout -- lib pubspec.yaml analysis_options.yaml || true
          # 模板生成的 example test 引用的是计数器 App，会污染 analyze
          rm -f test/widget_test.dart
          head -n 8 pubspec.yaml
          ls lib lib/render

      - name: 应用 AndroidManifest
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -e
          if [ ! -f tool/android/AndroidManifest.xml ]; then
            echo "::error::tool/android/AndroidManifest.xml 不在仓库里"
            echo "多半是 .gitignore 里写了 'android/'（少了前导斜杠），把 tool/android/ 也忽略了："
            git check-ignore -v tool/android/AndroidManifest.xml || true
            echo "修复：把 .gitignore 改成 /android/，然后 git add -f tool/android/AndroidManifest.xml"
            exit 1
          fi
          cp tool/android/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
          grep -n 'android:label' android/app/src/main/AndroidManifest.xml

      - name: 拉依赖
        working-directory: ${{ env.APP_DIR }}
        run: flutter pub get

      - name: 静态分析
        working-directory: ${{ env.APP_DIR }}
        run: |
          set +e
          flutter analyze --no-fatal-infos 2>&1 | tee analyze.log
          {
            echo "## Dart 静态分析"
            echo '```'
            grep -E 'error .' analyze.log | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: 构建 APK
        working-directory: ${{ env.APP_DIR }}
        run: |
          set -o pipefail
          flutter build apk --release --split-per-abi 2>&1 | tee build.log

      - name: 失败摘要
        if: failure()
        working-directory: ${{ env.APP_DIR }}
        run: |
          {
            echo "## 失败摘要"
            echo '```'
            grep -hE 'error |Error:|Target kernel|Exception' build.log analyze.log 2>/dev/null | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "--- build.log 末尾 ---"
          tail -n 60 build.log 2>/dev/null || true

      - name: 上传产物
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sujian-apk
          path: |
            ${{ env.APP_DIR }}/build/app/outputs/flutter-apk/*.apk
            ${{ env.APP_DIR }}/build/app/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
