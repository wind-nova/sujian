name: build-apk

on:
  push:
    branches: [main, master]
    paths-ignore:
      - '**.md'
  workflow_dispatch:

jobs:
  apk:
    name: Flutter Release APK
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.5'
          channel: stable
          cache: true

      - name: Build
        run: |
          chmod +x tool/cloud_build.sh
          ./tool/cloud_build.sh

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sujian-apk
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
